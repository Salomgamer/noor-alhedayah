  <!-- Favicon & PWA Icons in High-Quality SVG -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- Critical Override: Force Nav Bar to RIGHT side and automatically wipe stale cache -->
  <style>
    /* Fixed right-side sidebar on desktop across all languages */
    html body .side,
    aside.side {
      position: fixed !important;
      inset: auto !important;
      top: 0 !important;
      bottom: 0 !important;
      right: 0 !important;
      left: auto !important;
      border-left: 3px solid #c8a24a !important;
      border-right: none !important;
      z-index: 9999 !important;
      transform: none !important;
    }
    html body .pg {
      margin-right: var(--sbw, 236px) !important;
      margin-left: 0 !important;
      transition: margin .25s ease !important;
    }
    html body .dock,
    html body .abar {
      right: var(--sbw, 236px) !important;
      left: 0 !important;
    }

    /* MIDDLE LOCK: Centered fonts across buttons, headers, and cards */
    .side .side-btn,
    html body .side .side-btn {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center !important;
      gap: 8px !important;
    }
    .side .side-btn .bi {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .side .side-btn .bt {
      display: inline-block !important;
      text-align: center !important;
    }
    .side .logo2,
    .side .fold,
    .side .sep {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center !important;
    }
    main h1, main h2, main h3, main h4,
    .pg h1, .pg h2, .pg h3, .pg h4 {
      text-align: center !important;
    }
    .card, .pcard {
      text-align: center !important;
    }
    .card h1, .card h2, .card h3, .card h4, .card p,
    .pcard h1, .pcard h2, .pcard h3, .pcard h4, .pcard p {
      text-align: center !important;
    }
    .hero, .hero h1, .hero h2, .hero p, .hero .mut {
      text-align: center !important;
    }

    /* Classical Quranic Typography & Centering in both modes */
    .quran, .mushaf, .ayah, .bsm, .dtxt, .hadith, [data-quran] {
      direction: rtl !important;
      text-align: center !important;
      font-family: 'Amiri Quran', 'Scheherazade New', 'Amiri', serif !important;
      line-height: 2.2 !important;
    }

    @media (max-width: 899px) {
      html body .side, aside.side { display: none !important; }
      html body .pg { margin-right: 0 !important; margin-left: 0 !important; }
      html body .dock, html body .abar { right: 0 !important; left: 0 !important; }
    }
  </style>
  <script>
    (function() {
      var CURRENT_VER = '15.0';
      var lastVer = localStorage.getItem('app_applied_ver');
      if (lastVer !== CURRENT_VER) {
        localStorage.setItem('app_applied_ver', CURRENT_VER);
        if (typeof caches !== 'undefined') {
          caches.keys().then(function(names) {
            return Promise.all(names.map(function(n) { return caches.delete(n); }));
          }).then(function() {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister(); }));
              }).then(function() {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          });
        }
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- Interactive Pointer Hover Engine -->
  <script>
    (function() {
      if (typeof window === 'undefined') return;
      var glow = document.createElement('div');
      glow.className = 'pointer-glow';
      glow.setAttribute('aria-hidden', 'true');
      
      function initGlow() {
        if (document.body && !document.body.contains(glow)) {
          document.body.appendChild(glow);
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initGlow);
      } else {
        initGlow();
      }

      var rafId = null;
      var mouseX = -999, mouseY = -999;
      var isOverInteractive = false;

      window.addEventListener('pointermove', function(e) {
        if (e.pointerType === 'touch') return;
        document.body.classList.add('has-pointer');
        mouseX = e.clientX;
        mouseY = e.clientY;

        var target = e.target.closest('.card, .pcard, a.card, .side-btn, .btn, .tile, .hero');
        if (target) {
          isOverInteractive = true;
          var rect = target.getBoundingClientRect();
          target.style.setProperty('--pointer-x', (e.clientX - rect.left) + 'px');
          target.style.setProperty('--pointer-y', (e.clientY - rect.top) + 'px');
        } else {
          isOverInteractive = false;
        }

        if (!rafId) {
          rafId = requestAnimationFrame(function() {
            glow.style.left = mouseX + 'px';
            glow.style.top = mouseY + 'px';
            if (isOverInteractive) {
              document.body.classList.add('pointer-hovering');
            } else {
              document.body.classList.remove('pointer-hovering');
            }
            rafId = null;
          });
        }
      }, { passive: true });

      window.addEventListener('pointerleave', function() {
        document.body.classList.remove('has-pointer');
      });
    })();
  </script>

</body>
</html>
