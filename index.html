<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نور الهداية — المكتبة الإسلامية الرقمية</title>
  <meta name="description" content="نور الهداية: تطبيق إسلامي شامل يضم القرآن الكريم، السنة النبوية، مواقيت الصلاة، اتجاه القبلة، الأذكار، وقصص الأنبياء." />
  <meta name="theme-color" content="#06382e" />
  
  <!-- Favicon & PWA Icons in High-Quality SVG -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  
  <!-- Modern Arabic Google Fonts: Readex Pro, Cairo & Amiri Quran -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;500;600;700;800;900&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css?v=10" />
  
  <!-- Application Script -->
  <script defer src="js/app.js?v=10"></script>
  <!-- Critical Override: Force Nav Bar to RIGHT side and automatically wipe stale cache -->
  <style>
    html body .side,
    aside.side {
      position: fixed !important;
      top: 0 !important;
      bottom: 0 !important;
      right: 0 !important;
      left: auto !important;
      margin-left: 0 !important;
      border-left: 3px solid #c8a24a !important;
      border-right: none !important;
      direction: rtl !important;
      z-index: 9999 !important;
      transform: none !important;
    }
    html body .pg {
      margin-right: var(--sbw, 236px) !important;
      margin-left: 0 !important;
      transition: margin .25s ease !important;
    }
    html body .dock,
    html body .abar {
      right: var(--sbw, 236px) !important;
      left: 0 !important;
    }
    @media (max-width: 899px) {
      html body .side, aside.side { display: none !important; }
      html body .pg { margin-right: 0 !important; margin-left: 0 !important; }
      html body .dock, html body .abar { right: 0 !important; left: 0 !important; }
    }
  </style>
  <script>
    (function() {
      var CURRENT_VER = '10.1';
      var lastVer = localStorage.getItem('app_applied_ver');
      if (lastVer !== CURRENT_VER) {
        localStorage.setItem('app_applied_ver', CURRENT_VER);
        if (typeof caches !== 'undefined') {
          caches.keys().then(function(names) {
            return Promise.all(names.map(function(n) { return caches.delete(n); }));
          }).then(function() {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister(); }));
              }).then(function() {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          });
        }
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
